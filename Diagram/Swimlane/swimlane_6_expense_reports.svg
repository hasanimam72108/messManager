<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1060" height="560" viewBox="0 0 1060 560">
  <style>
    text{font-family:Arial,sans-serif}
    .title{font-size:15px;font-weight:bold;fill:#111}
    .laneName{font-size:12px;font-weight:bold;fill:#111;text-anchor:middle}
    .box{fill:#fff;stroke:#444;stroke-width:1.4}
    .dia{fill:#fff;stroke:#444;stroke-width:1.4}
    .dot{fill:#222}
    .txt{font-size:11px;fill:#111;text-anchor:middle}
    .txtsm{font-size:9.5px;fill:#555;text-anchor:middle}
    .lbl{font-size:9.5px;fill:#555}
    .conn{stroke:#333;stroke-width:1.4;fill:none}
    .dash{stroke:#888;stroke-width:1.2;fill:none;stroke-dasharray:5 4}
    .laneA{fill:#fafafa;stroke:#ccc;stroke-width:1}
    .laneB{fill:#f5f5f5;stroke:#ccc;stroke-width:1}
    .vdiv{stroke:#bbb;stroke-width:1}
    .hdiv{stroke:#bbb;stroke-width:1}
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#333"/></marker>
    <marker id="d" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#888"/></marker>
  </defs>

  <text class="title" x="18" y="20">Swimlane 6 — Expense Management &amp; Monthly Reports</text>

  <!--
    Lanes (4):
    Manager : x=18,  w=250, cx=143  | box x=33,  w=220
    Web UI  : x=268, w=250, cx=393  | box x=283, w=220
    API     : x=518, w=265, cx=650  | box x=535, w=230
    Database: x=783, w=245, cx=905  | box x=798, w=214
  -->
  <rect class="laneA" x="18"  y="28" width="250" height="532"/>
  <rect class="laneB" x="268" y="28" width="250" height="532"/>
  <rect class="laneA" x="518" y="28" width="265" height="532"/>
  <rect class="laneB" x="783" y="28" width="245" height="532"/>
  <line class="vdiv" x1="268" y1="28" x2="268" y2="560"/>
  <line class="vdiv" x1="518" y1="28" x2="518" y2="560"/>
  <line class="vdiv" x1="783" y1="28" x2="783" y2="560"/>
  <text class="laneName" x="143" y="46">Manager</text>
  <text class="laneName" x="393" y="46">Web UI</text>
  <text class="laneName" x="650" y="46">Laravel API</text>
  <text class="laneName" x="905" y="46">Database</text>
  <line class="hdiv" x1="18" y1="52" x2="1028" y2="52"/>

  <!-- Manager start -->
  <circle class="dot" cx="143" cy="68" r="10"/>
  <line class="conn" x1="143" y1="78" x2="143" y2="84" marker-end="url(#a)"/>

  <!-- ROW 1 (cy=102): Manager: Add Expense → WebUI → API → DB -->
  <rect class="box" x="33"  y="84" width="220" height="36" rx="3"/>
  <text class="txt" x="143" y="100">Add Expense</text>
  <text class="txtsm" x="143" y="114">Title, amount, date, type</text>
  <line class="conn" x1="253" y1="102" x2="281" y2="102" marker-end="url(#a)"/>
  <rect class="box" x="283" y="84" width="220" height="36" rx="3"/>
  <text class="txt" x="393" y="100">POST /manager/expenses</text>
  <text class="txtsm" x="393" y="114">Expense form submission</text>
  <line class="conn" x1="503" y1="102" x2="533" y2="102" marker-end="url(#a)"/>
  <rect class="box" x="535" y="84" width="230" height="36" rx="3"/>
  <text class="txt" x="650" y="100">Validate &amp; Save Expense</text>
  <text class="txtsm" x="650" y="114">Manager role &amp; mess_id check</text>
  <line class="conn" x1="765" y1="102" x2="796" y2="102" marker-end="url(#a)"/>
  <rect class="box" x="798" y="84" width="214" height="36" rx="3"/>
  <text class="txt" x="905" y="100">Insert Expense Row</text>
  <text class="txtsm" x="905" y="114">Against mess for the month</text>

  <line class="conn" x1="143" y1="120" x2="143" y2="140" marker-end="url(#a)"/>

  <!-- ROW 2 (cy=158): Manager: Set Fixed Costs → WebUI → API → DB -->
  <rect class="box" x="33"  y="140" width="220" height="36" rx="3"/>
  <text class="txt" x="143" y="156">Set Fixed Costs</text>
  <text class="txtsm" x="143" y="170">Rent, khala, utilities, wifi</text>
  <line class="conn" x1="253" y1="158" x2="281" y2="158" marker-end="url(#a)"/>
  <rect class="box" x="283" y="140" width="220" height="36" rx="3"/>
  <text class="txt" x="393" y="156">PUT /manager/fixed-costs</text>
  <text class="txtsm" x="393" y="170">Monthly fixed cost form</text>
  <line class="conn" x1="503" y1="158" x2="533" y2="158" marker-end="url(#a)"/>
  <rect class="box" x="535" y="140" width="230" height="36" rx="3"/>
  <text class="txt" x="650" y="156">Upsert FixedCost</text>
  <text class="txtsm" x="650" y="170">month key YYYY-MM</text>
  <line class="conn" x1="765" y1="158" x2="796" y2="158" marker-end="url(#a)"/>
  <rect class="box" x="798" y="140" width="214" height="36" rx="3"/>
  <text class="txt" x="905" y="156">Upsert FixedCost Record</text>
  <text class="txtsm" x="905" y="170">rent, khala, utilities, wifi</text>

  <line class="conn" x1="143" y1="176" x2="143" y2="196" marker-end="url(#a)"/>

  <!-- ROW 3 (cy=214): Manager: View Monthly Report → WebUI → API → DB -->
  <rect class="box" x="33"  y="196" width="220" height="36" rx="3"/>
  <text class="txt" x="143" y="212">View Monthly Report</text>
  <text class="txtsm" x="143" y="226">Financial summary for month</text>
  <line class="conn" x1="253" y1="214" x2="281" y2="214" marker-end="url(#a)"/>
  <rect class="box" x="283" y="196" width="220" height="36" rx="3"/>
  <text class="txt" x="393" y="212">GET /manager/expenses/summary</text>
  <text class="txtsm" x="393" y="226">Monthly report view</text>
  <line class="conn" x1="503" y1="214" x2="533" y2="214" marker-end="url(#a)"/>
  <rect class="box" x="535" y="196" width="230" height="36" rx="3"/>
  <text class="txt" x="650" y="212">Aggregate Monthly Data</text>
  <text class="txtsm" x="650" y="226">Meals, expenses, per-member</text>
  <line class="conn" x1="765" y1="214" x2="796" y2="214" marker-end="url(#a)"/>
  <rect class="box" x="798" y="196" width="214" height="36" rx="3"/>
  <text class="txt" x="905" y="214">Query Month Records</text>
  <text class="txtsm" x="905" y="226">Meals + expenses + transactions</text>

  <line class="conn" x1="143" y1="232" x2="143" y2="252" marker-end="url(#a)"/>

  <!-- ROW 4 (cy=270): Manager: View Member Financials → WebUI → API → DB -->
  <rect class="box" x="33"  y="252" width="220" height="36" rx="3"/>
  <text class="txt" x="143" y="268">View Member Financials</text>
  <text class="txtsm" x="143" y="282">Per-member breakdown</text>
  <line class="conn" x1="253" y1="270" x2="281" y2="270" marker-end="url(#a)"/>
  <rect class="box" x="283" y="252" width="220" height="36" rx="3"/>
  <text class="txt" x="393" y="268">GET /manager/financials/members</text>
  <text class="txtsm" x="393" y="282">Member financials view</text>
  <line class="conn" x1="503" y1="270" x2="533" y2="270" marker-end="url(#a)"/>
  <rect class="box" x="535" y="252" width="230" height="36" rx="3"/>
  <text class="txt" x="650" y="270">Per-Member Bill Calculation</text>
  <text class="txtsm" x="650" y="282">meal subtotal + fixed share</text>
  <line class="conn" x1="765" y1="270" x2="796" y2="270" marker-end="url(#a)"/>
  <rect class="box" x="798" y="252" width="214" height="36" rx="3"/>
  <text class="txt" x="905" y="270">Query All Records</text>
  <text class="txtsm" x="905" y="282">Grouped by member</text>

  <!-- Arrow down to Refund? diamond -->
  <line class="conn" x1="143" y1="288" x2="143" y2="306" marker-end="url(#a)"/>

  <!-- Refund? diamond  center(143,330): top(143,306) right(208,330) bottom(143,354) left(78,330) -->
  <polygon class="dia" points="143,306 208,330 143,354 78,330"/>
  <text class="txt" x="143" y="334">Refund Member?</text>
  <text class="txtsm" x="143" y="345">(extra paid amount)</text>

  <!-- YES → right into WebUI (cy=330) -->
  <path class="conn" d="M208 330 L281 330" marker-end="url(#a)"/>
  <text class="lbl" x="214" y="325">Yes</text>

  <!-- YES ROW (cy=330, y=312–348): WebUI → API → DB -->
  <rect class="box" x="283" y="312" width="220" height="36" rx="3"/>
  <text class="txt" x="393" y="328">POST /financials/{id}/refund</text>
  <text class="txtsm" x="393" y="342">Refund amount submitted</text>
  <line class="conn" x1="503" y1="330" x2="533" y2="330" marker-end="url(#a)"/>
  <rect class="box" x="535" y="312" width="230" height="36" rx="3"/>
  <text class="txt" x="650" y="328">Record Refund Transaction</text>
  <text class="txtsm" x="650" y="342">Split meal + fixed portions</text>
  <line class="conn" x1="765" y1="330" x2="796" y2="330" marker-end="url(#a)"/>
  <rect class="box" x="798" y="312" width="214" height="36" rx="3"/>
  <text class="txt" x="905" y="328">Insert Negative Transaction</text>
  <text class="txtsm" x="905" y="342">Reduces running balance</text>

  <!-- NO → down from diamond -->
  <path class="conn" d="M143 354 L143 384" marker-end="url(#a)"/>
  <text class="lbl" x="148" y="374">No</text>

  <!-- Both YES and NO converge to end -->
  <!-- YES: from below refund YES box area, Manager continues -->
  <path class="conn" d="M208 348 L208 384 L155 384" marker-end="url(#a)"/>

  <!-- End node -->
  <circle class="dot" cx="143" cy="396" r="10"/>
  <circle cx="143" cy="396" r="16" fill="none" stroke="#222" stroke-width="2"/>
</svg>
