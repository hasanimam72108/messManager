<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="440" viewBox="0 0 1320 440">
  <style>
    text{font-family:Arial,sans-serif}
    .title{font-size:15px;font-weight:bold;fill:#111}
    .laneName{font-size:12px;font-weight:bold;fill:#111;text-anchor:middle}
    .box{fill:#fff;stroke:#444;stroke-width:1.4}
    .dia{fill:#fff;stroke:#444;stroke-width:1.4}
    .dot{fill:#222}
    .txt{font-size:11px;fill:#111;text-anchor:middle}
    .txtsm{font-size:9.5px;fill:#555;text-anchor:middle}
    .lbl{font-size:9.5px;fill:#555}
    .conn{stroke:#333;stroke-width:1.4;fill:none}
    .dash{stroke:#888;stroke-width:1.2;fill:none;stroke-dasharray:5 4}
    .laneA{fill:#fafafa;stroke:#ccc;stroke-width:1}
    .laneB{fill:#f5f5f5;stroke:#ccc;stroke-width:1}
    .vdiv{stroke:#bbb;stroke-width:1}
    .hdiv{stroke:#bbb;stroke-width:1}
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#333"/></marker>
    <marker id="d" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#888"/></marker>
  </defs>

  <text class="title" x="18" y="20">Swimlane 1 — Login &amp; Authentication</text>

  <!-- Lane backgrounds  Member(18,210) Manager(228,210) Admin(438,210) WebUI(648,210) API(858,225) DB(1083,210) -->
  <rect class="laneA" x="18"   y="28" width="210" height="412"/>
  <rect class="laneB" x="228"  y="28" width="210" height="412"/>
  <rect class="laneA" x="438"  y="28" width="210" height="412"/>
  <rect class="laneB" x="648"  y="28" width="210" height="412"/>
  <rect class="laneA" x="858"  y="28" width="225" height="412"/>
  <rect class="laneB" x="1083" y="28" width="210" height="412"/>
  <line class="vdiv" x1="228"  y1="28" x2="228"  y2="440"/>
  <line class="vdiv" x1="438"  y1="28" x2="438"  y2="440"/>
  <line class="vdiv" x1="648"  y1="28" x2="648"  y2="440"/>
  <line class="vdiv" x1="858"  y1="28" x2="858"  y2="440"/>
  <line class="vdiv" x1="1083" y1="28" x2="1083" y2="440"/>
  <text class="laneName" x="123"  y="46">Member</text>
  <text class="laneName" x="333"  y="46">Manager</text>
  <text class="laneName" x="543"  y="46">Admin</text>
  <text class="laneName" x="753"  y="46">Web UI</text>
  <text class="laneName" x="970"  y="46">Laravel API</text>
  <text class="laneName" x="1188" y="46">Database</text>
  <line class="hdiv" x1="18" y1="52" x2="1293" y2="52"/>

  <!-- Start nodes -->
  <circle class="dot" cx="123" cy="68" r="10"/>
  <circle class="dot" cx="333" cy="68" r="10"/>
  <circle class="dot" cx="543" cy="68" r="10"/>

  <!-- ROW 1 (cy=102): Login | Authentication | Validate User -->
  <path class="conn" d="M123 78 L123 102 L658 102" marker-end="url(#a)"/>
  <path class="conn" d="M333 78 L333 94 L753 94 L753 82" marker-end="url(#a)"/>
  <path class="conn" d="M543 78 L543 89 L753 89"/>
  <rect class="box" x="660" y="84" width="186" height="36" rx="3"/>
  <text class="txt" x="753" y="107">Login</text>
  <line class="conn" x1="846" y1="102" x2="858" y2="102" marker-end="url(#a)"/>
  <rect class="box" x="870" y="84" width="195" height="36" rx="3"/>
  <text class="txt" x="967" y="100">Authentication</text>
  <text class="txtsm" x="967" y="114">POST /api/login</text>
  <line class="conn" x1="1065" y1="102" x2="1081" y2="102" marker-end="url(#a)"/>
  <rect class="box" x="1095" y="84" width="186" height="36" rx="3"/>
  <text class="txt" x="1188" y="107">Validate User</text>

  <!-- Valid? diamond  center (967,148): top(967,126) right(1022,148) bottom(967,170) left(912,148) -->
  <line class="conn" x1="967" y1="120" x2="967" y2="124" marker-end="url(#a)"/>
  <polygon class="dia" points="967,126 1022,148 967,170 912,148"/>
  <text class="txt" x="967" y="152">Valid?</text>
  <!-- Invalid dashed back to Login -->
  <path class="dash" d="M912 148 L753 148 L753 120" marker-end="url(#d)"/>
  <text class="lbl" x="818" y="143">Invalid</text>
  <!-- Valid → Return Token -->
  <line class="conn" x1="967" y1="170" x2="967" y2="188" marker-end="url(#a)"/>
  <text class="lbl" x="976" y="185">Valid</text>

  <!-- ROW 2 (cy=206): Return Sanctum Token (API) -->
  <rect class="box" x="870" y="188" width="195" height="36" rx="3"/>
  <text class="txt" x="967" y="204">Return Sanctum Token</text>
  <text class="txtsm" x="967" y="218">token + user role</text>
  <!-- API → WebUI: Store Token -->
  <path class="conn" d="M870 206 L843 206 L843 242" marker-end="url(#a)"/>

  <!-- ROW 3 (cy=260): Store Token (WebUI) -->
  <rect class="box" x="660" y="242" width="186" height="36" rx="3"/>
  <text class="txt" x="753" y="258">Store Token</text>
  <text class="txtsm" x="753" y="272">localStorage + Redux</text>

  <!-- Role? diamond  center (753,306): top(753,284) right(808,306) bottom(753,328) left(698,306) -->
  <line class="conn" x1="753" y1="278" x2="753" y2="282" marker-end="url(#a)"/>
  <polygon class="dia" points="753,284 808,306 753,328 698,306"/>
  <text class="txt" x="753" y="310">Role?</text>
  <!-- Member branch -->
  <path class="conn" d="M698 306 L123 306 L123 350" marker-end="url(#a)"/>
  <text class="lbl" x="388" y="301">Member</text>
  <!-- Manager branch -->
  <path class="conn" d="M753 328 L753 342 L333 342 L333 350" marker-end="url(#a)"/>
  <text class="lbl" x="545" y="340">Manager</text>
  <!-- Admin branch -->
  <path class="conn" d="M808 306 L830 306 L830 344 L543 344 L543 350" marker-end="url(#a)"/>
  <text class="lbl" x="836" y="303">Admin</text>

  <!-- ROW 4 (cy=368): Dashboards -->
  <rect class="box" x="33"  y="350" width="180" height="36" rx="3"/>
  <text class="txt" x="123" y="373">Member Dashboard</text>
  <rect class="box" x="243" y="350" width="180" height="36" rx="3"/>
  <text class="txt" x="333" y="373">Manager Dashboard</text>
  <rect class="box" x="453" y="350" width="180" height="36" rx="3"/>
  <text class="txt" x="543" y="373">Admin Panel</text>

  <!-- End nodes -->
  <line class="conn" x1="123" y1="386" x2="123" y2="404" marker-end="url(#a)"/>
  <circle class="dot" cx="123" cy="414" r="10"/>
  <circle cx="123" cy="414" r="16" fill="none" stroke="#222" stroke-width="2"/>
  <line class="conn" x1="333" y1="386" x2="333" y2="404" marker-end="url(#a)"/>
  <circle class="dot" cx="333" cy="414" r="10"/>
  <circle cx="333" cy="414" r="16" fill="none" stroke="#222" stroke-width="2"/>
  <line class="conn" x1="543" y1="386" x2="543" y2="404" marker-end="url(#a)"/>
  <circle class="dot" cx="543" cy="414" r="10"/>
  <circle cx="543" cy="414" r="16" fill="none" stroke="#222" stroke-width="2"/>
</svg>
