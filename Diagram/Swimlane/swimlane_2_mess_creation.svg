<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="400" viewBox="0 0 1180 400">
  <style>
    text{font-family:Arial,sans-serif}
    .title{font-size:15px;font-weight:bold;fill:#111}
    .laneName{font-size:12px;font-weight:bold;fill:#111;text-anchor:middle}
    .box{fill:#fff;stroke:#444;stroke-width:1.4}
    .dia{fill:#fff;stroke:#444;stroke-width:1.4}
    .dot{fill:#222}
    .txt{font-size:11px;fill:#111;text-anchor:middle}
    .txtsm{font-size:9.5px;fill:#555;text-anchor:middle}
    .lbl{font-size:9.5px;fill:#555}
    .conn{stroke:#333;stroke-width:1.4;fill:none}
    .dash{stroke:#888;stroke-width:1.2;fill:none;stroke-dasharray:5 4}
    .laneA{fill:#fafafa;stroke:#ccc;stroke-width:1}
    .laneB{fill:#f5f5f5;stroke:#ccc;stroke-width:1}
    .vdiv{stroke:#bbb;stroke-width:1}
    .hdiv{stroke:#bbb;stroke-width:1}
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#333"/></marker>
    <marker id="d" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#888"/></marker>
  </defs>

  <text class="title" x="18" y="20">Swimlane 2 — Mess Creation &amp; Admin Approval</text>

  <!--
    Lanes (5):
    Manager : x=18,  w=225, cx=130  | box x=32,  w=196
    Admin   : x=243, w=225, cx=355  | box x=257, w=196
    Web UI  : x=468, w=225, cx=580  | box x=482, w=196
    API     : x=693, w=240, cx=813  | box x=707, w=212
    Database: x=933, w=222, cx=1044 | box x=948, w=192
  -->
  <rect class="laneA" x="18"  y="28" width="225" height="372"/>
  <rect class="laneB" x="243" y="28" width="225" height="372"/>
  <rect class="laneA" x="468" y="28" width="225" height="372"/>
  <rect class="laneB" x="693" y="28" width="240" height="372"/>
  <rect class="laneA" x="933" y="28" width="222" height="372"/>
  <line class="vdiv" x1="243"  y1="28" x2="243"  y2="400"/>
  <line class="vdiv" x1="468"  y1="28" x2="468"  y2="400"/>
  <line class="vdiv" x1="693"  y1="28" x2="693"  y2="400"/>
  <line class="vdiv" x1="933"  y1="28" x2="933"  y2="400"/>
  <text class="laneName" x="130"  y="46">Manager</text>
  <text class="laneName" x="355"  y="46">Admin</text>
  <text class="laneName" x="580"  y="46">Web UI</text>
  <text class="laneName" x="813"  y="46">Laravel API</text>
  <text class="laneName" x="1044" y="46">Database</text>
  <line class="hdiv" x1="18" y1="52" x2="1155" y2="52"/>

  <!-- Manager start -->
  <circle class="dot" cx="130" cy="68" r="10"/>
  <line class="conn" x1="130" y1="78" x2="130" y2="84" marker-end="url(#a)"/>

  <!-- ROW 1 (cy=102): Manager: Fill Registration Form → WebUI → API → DB -->
  <rect class="box" x="32"  y="84" width="196" height="36" rx="3"/>
  <text class="txt" x="130" y="100">Fill Registration Form</text>
  <text class="txtsm" x="130" y="114">Mess name, email, password</text>
  <!-- Manager → WebUI (arrow skips Admin lane) -->
  <path class="conn" d="M228 102 L480 102" marker-end="url(#a)"/>
  <rect class="box" x="482" y="84" width="196" height="36" rx="3"/>
  <text class="txt" x="580" y="100">Validate &amp; Submit</text>
  <text class="txtsm" x="580" y="114">Client-side form checks</text>
  <line class="conn" x1="678" y1="102" x2="705" y2="102" marker-end="url(#a)"/>
  <rect class="box" x="707" y="84" width="212" height="36" rx="3"/>
  <text class="txt" x="813" y="100">POST /api/register</text>
  <text class="txtsm" x="813" y="114">Create MessRequest record</text>
  <line class="conn" x1="919" y1="102" x2="946" y2="102" marker-end="url(#a)"/>
  <rect class="box" x="948" y="84" width="192" height="36" rx="3"/>
  <text class="txt" x="1044" y="100">Insert MessRequest</text>
  <text class="txtsm" x="1044" y="114">status = pending</text>

  <!-- Dashed: DB notifies Admin of pending request -->
  <path class="dash" d="M948 102 L355 102 L355 140" marker-end="url(#d)"/>
  <text class="lbl" x="600" y="97">pending request visible</text>

  <!-- ROW 2 (cy=158): Admin: Review Mess Request -->
  <rect class="box" x="257" y="140" width="196" height="36" rx="3"/>
  <text class="txt" x="355" y="163">Review Mess Request</text>
  <line class="conn" x1="355" y1="176" x2="355" y2="180" marker-end="url(#a)"/>

  <!-- Approve? diamond  center(355,204): top(355,180) right(414,204) bottom(355,228) left(296,204) -->
  <polygon class="dia" points="355,180 414,204 355,228 296,204"/>
  <text class="txt" x="355" y="208">Approve?</text>

  <!-- YES → right into WebUI at cy=204 -->
  <path class="conn" d="M414 204 L480 204" marker-end="url(#a)"/>
  <text class="lbl" x="420" y="199">Yes</text>

  <!-- YES ROW (cy=204, y=186–222): Approve → API: Create Mess+User → DB: Insert -->
  <rect class="box" x="482" y="186" width="196" height="36" rx="3"/>
  <text class="txt" x="580" y="202">POST /admin/approve</text>
  <text class="txtsm" x="580" y="216">Approval submitted</text>
  <line class="conn" x1="678" y1="204" x2="705" y2="204" marker-end="url(#a)"/>
  <rect class="box" x="707" y="186" width="212" height="36" rx="3"/>
  <text class="txt" x="813" y="202">Create Mess + Manager User</text>
  <text class="txtsm" x="813" y="216">Account + credentials created</text>
  <line class="conn" x1="919" y1="204" x2="946" y2="204" marker-end="url(#a)"/>
  <rect class="box" x="948" y="186" width="192" height="36" rx="3"/>
  <text class="txt" x="1044" y="202">Insert Mess + User</text>
  <text class="txtsm" x="1044" y="216">status = approved</text>
  <!-- Manager: Receive Credentials box (YES) -->
  <rect class="box" x="32" y="186" width="196" height="36" rx="3"/>
  <text class="txt" x="130" y="202">Receive Credentials</text>
  <text class="txtsm" x="130" y="216">Temp password + mess ID</text>
  <!-- Dashed: DB → Manager (routed below YES row) -->
  <path class="dash" d="M1044 222 L1044 228 L130 228 L130 222" marker-end="url(#d)"/>

  <!-- NO → down from diamond bottom -->
  <path class="conn" d="M355 228 L355 248" marker-end="url(#a)"/>
  <text class="lbl" x="360" y="243">No</text>

  <!-- NO ROW (cy=266, y=248–284): Admin: Reject → WebUI → API → DB -->
  <rect class="box" x="257" y="248" width="196" height="36" rx="3"/>
  <text class="txt" x="355" y="271">Reject Request</text>
  <path class="conn" d="M453 266 L480 266" marker-end="url(#a)"/>
  <rect class="box" x="482" y="248" width="196" height="36" rx="3"/>
  <text class="txt" x="580" y="264">POST /admin/reject</text>
  <text class="txtsm" x="580" y="278">Rejection submitted</text>
  <line class="conn" x1="678" y1="266" x2="705" y2="266" marker-end="url(#a)"/>
  <rect class="box" x="707" y="248" width="212" height="36" rx="3"/>
  <text class="txt" x="813" y="271">Update MessRequest</text>
  <text class="txtsm" x="813" y="278">status = rejected</text>
  <line class="conn" x1="919" y1="266" x2="946" y2="266" marker-end="url(#a)"/>
  <rect class="box" x="948" y="248" width="192" height="36" rx="3"/>
  <text class="txt" x="1044" y="266">Update MessRequest</text>
  <text class="txtsm" x="1044" y="278">rejected_at, timestamp</text>
  <!-- Manager: Notified (Rejected) box -->
  <rect class="box" x="32" y="248" width="196" height="36" rx="3"/>
  <text class="txt" x="130" y="271">Notified (Rejected)</text>
  <!-- Dashed: DB → Manager (below NO row) -->
  <path class="dash" d="M1044 284 L1044 290 L130 290 L130 284" marker-end="url(#d)"/>

  <!-- End nodes -->
  <line class="conn" x1="130" y1="284" x2="130" y2="336" marker-end="url(#a)"/>
  <circle class="dot" cx="130" cy="348" r="10"/>
  <circle cx="130" cy="348" r="16" fill="none" stroke="#222" stroke-width="2"/>
  <line class="conn" x1="355" y1="284" x2="355" y2="336" marker-end="url(#a)"/>
  <circle class="dot" cx="355" cy="348" r="10"/>
  <circle cx="355" cy="348" r="16" fill="none" stroke="#222" stroke-width="2"/>
</svg>
