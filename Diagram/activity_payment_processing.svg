<svg xmlns="http://www.w3.org/2000/svg" width="270" height="780" viewBox="0 0 270 780">
  <style>
    .stroke { stroke:#000; stroke-width:2; fill:none }
    .box { fill:#fff; stroke:#000; stroke-width:2 }
    .label { font-family: Arial, sans-serif; font-size:14px; fill:#000 }
  </style>

  <!-- Start -->
  <circle cx="135" cy="30" r="12" class="stroke" fill="#fff"/>

  <!-- Member deposit -->
  <rect x="75" y="70" width="120" height="34" rx="2" class="box"/>
  <text x="135" y="93" text-anchor="middle" class="label">Member deposit</text>
  <path d="M135 82 v18" class="stroke" marker-end="url(#arr)"/>

  <!-- Update ledger -->
  <rect x="55" y="140" width="160" height="34" rx="2" class="box"/>
  <text x="135" y="163" text-anchor="middle" class="label">Update ledger</text>
  <path d="M135 114 v20" class="stroke"/>
  <path d="M135 174 v18" class="stroke" marker-end="url(#arr)"/>

  <!-- Send receipt -->
  <rect x="75" y="220" width="120" height="34" rx="2" class="box"/>
  <text x="135" y="243" text-anchor="middle" class="label">Send receipt</text>
  <path d="M135 192 v28" class="stroke"/>
  <path d="M135 254 v18" class="stroke" marker-end="url(#arr)"/>

  <!-- Reconcile -->
  <rect x="55" y="300" width="160" height="34" rx="2" class="box"/>
  <text x="135" y="323" text-anchor="middle" class="label">Reconcile</text>
  <path d="M135 272 v24" class="stroke"/>
  <path d="M135 334 v28" class="stroke" marker-end="url(#arr)"/>

  <!-- End (reconciled) -->
  <rect x="105" y="370" width="60" height="34" rx="2" class="box"/>
  <text x="135" y="393" text-anchor="middle" class="label">Done</text>

  <circle cx="135" cy="500" r="14" class="stroke"/>
  <circle cx="135" cy="500" r="6" fill="#000"/>

  <defs>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M0 0 L9 5 L0 10 z" fill="#000" />
    </marker>
  </defs>
</svg>