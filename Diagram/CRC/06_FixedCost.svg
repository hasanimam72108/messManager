<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="800" height="1000" viewBox="0 0 800 1000">
  <style>
    .card { fill: #fff; stroke: #333; stroke-width: 2 }
    .header { fill: #fff; stroke: #333; stroke-width: 2 }
    .headerText { font: 700 20px sans-serif; fill: #000; text-anchor: middle }
    .content { font: 12px sans-serif; fill: #222 }
    .sectionTitle { font: 700 14px sans-serif; fill: #333 }
    .divider { stroke: #ccc; stroke-width: 1 }
  </style>

  <rect class="card" x="40" y="40" width="720" height="920" rx="8" />
  <rect class="header" x="40" y="40" width="720" height="60" rx="8" />
  <text class="headerText" x="400" y="75">FixedCost</text>

  <line class="divider" x1="40" y1="120" x2="760" y2="120" stroke-width="2" />
  <line class="divider" x1="400" y1="120" x2="400" y2="960" stroke-width="2" />

  <text class="sectionTitle" x="60" y="150">Responsibilities:</text>
  <text class="content" x="60" y="180">â€¢ Store month key (YYYY-MM)</text>
  <text class="content" x="60" y="205">â€¢ Store rent amount</text>
  <text class="content" x="60" y="230">â€¢ Store khala (helper) cost</text>
  <text class="content" x="60" y="255">â€¢ Store utilities cost</text>
  <text class="content" x="60" y="280">â€¢ Store wifi cost</text>
  <text class="content" x="60" y="305">â€¢ Track which mess</text>
  <text class="content" x="60" y="330">â€¢ Track who created/updated</text>
  <text class="content" x="60" y="355">â€¢ Support monthly updates</text>

  <text class="sectionTitle" x="420" y="150">Collaborators:</text>
  <text class="content" x="420" y="180">Mess</text>
  <text class="content" x="420" y="205">User</text>
  <text class="content" x="420" y="230">BillingCalculator</text>

  <text class="sectionTitle" x="60" y="460">Attributes:</text>
  <text class="content" x="60" y="485">id, mess_id, month_key,</text>
  <text class="content" x="60" y="510">rent, khala, utilities, wifi</text>
  <text class="content" x="60" y="535">(all decimal), created_by,</text>
  <text class="content" x="60" y="560">updated_by, created_at,</text>
  <text class="content" x="60" y="585">updated_at</text>

  <text class="content" x="60" y="670" style="font: 11px sans-serif; fill: #666;">Key Relations:</text>
  <text class="content" x="60" y="690" style="font: 11px sans-serif; fill: #666;">- belongsTo(Mess, User)</text>
  <text class="content" x="60" y="710" style="font: 11px sans-serif; fill: #666;">- One entry per month per mess</text>
  <text class="content" x="60" y="730" style="font: 11px sans-serif; fill: #666;">- Used by BillingCalculator</text>
</svg>
