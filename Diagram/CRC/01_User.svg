<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="800" height="1000" viewBox="0 0 800 1000">
  <style>
    .card { fill: #fff; stroke: #333; stroke-width: 2 }
    .header { fill: #fff; stroke: #333; stroke-width: 2 }
    .headerText { font: 700 20px sans-serif; fill: #000; text-anchor: middle }
    .section { stroke: #999; stroke-width: 1 }
    .sectionTitle { font: 700 14px sans-serif; fill: #333 }
    .content { font: 12px sans-serif; fill: #222 }
    .divider { stroke: #ccc; stroke-width: 1 }
  </style>

  <!-- Card Background -->
  <rect class="card" x="40" y="40" width="720" height="920" rx="8" />
  
  <!-- Header -->
  <rect class="header" x="40" y="40" width="720" height="60" rx="8" />
  <text class="headerText" x="400" y="75">User</text>

  <!-- Main divider -->
  <line class="divider" x1="40" y1="120" x2="760" y2="120" stroke-width="2" />
  
  <!-- Column divider -->
  <line class="divider" x1="400" y1="120" x2="400" y2="960" stroke-width="2" />

  <!-- Responsibilities Column -->
  <text class="sectionTitle" x="60" y="150">Responsibilities:</text>
  <text class="content" x="60" y="180">â€¢ Authenticate with email/password</text>
  <text class="content" x="60" y="205">â€¢ Set/change password</text>
  <text class="content" x="60" y="230">â€¢ Maintain profile (name, email)</text>
  <text class="content" x="60" y="255">â€¢ Track role (superAdmin,</text>
  <text class="content" x="60" y="275">  manager, user)</text>
  <text class="content" x="60" y="300">â€¢ Manage must_change_password</text>
  <text class="content" x="60" y="325">  flag on first login</text>
  <text class="content" x="60" y="350">â€¢ Provide access to mess data</text>
  <text class="content" x="60" y="375">  if manager or member</text>
  <text class="content" x="60" y="400">â€¢ Store API tokens (Sanctum)</text>

  <!-- Collaborators Column -->
  <text class="sectionTitle" x="420" y="150">Collaborators:</text>
  <text class="content" x="420" y="180">Mess</text>
  <text class="content" x="420" y="205">Meal</text>
  <text class="content" x="420" y="230">UserTransaction</text>
  <text class="content" x="420" y="255">UserDepositRequest</text>
  <text class="content" x="420" y="280">AuthService</text>
  <text class="content" x="420" y="305">MemberManagementService</text>

  <!-- Notes -->
  <text class="sectionTitle" x="60" y="460">Attributes:</text>
  <text class="content" x="60" y="485">id, name, email, phone, password,</text>
  <text class="content" x="60" y="510">role, mess_id, must_change_password,</text>
  <text class="content" x="60" y="535">created_at, updated_at</text>

  <!-- Footer -->
  <text class="content" x="60" y="620" style="font: 11px sans-serif; fill: #666;">Key Relations:</text>
  <text class="content" x="60" y="640" style="font: 11px sans-serif; fill: #666;">- belongsTo(Mess) [if member]</text>
  <text class="content" x="60" y="660" style="font: 11px sans-serif; fill: #666;">- hasOne(Mess) [if manager]</text>
  <text class="content" x="60" y="680" style="font: 11px sans-serif; fill: #666;">- hasMany(Meal, Meal, Transaction)</text>
</svg>
