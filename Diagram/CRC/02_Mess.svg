<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="800" height="1000" viewBox="0 0 800 1000">
  <style>
    .card { fill: #fff; stroke: #333; stroke-width: 2 }
    .header { fill: #fff; stroke: #333; stroke-width: 2 }
    .headerText { font: 700 20px sans-serif; fill: #000; text-anchor: middle }
    .content { font: 12px sans-serif; fill: #222 }
    .sectionTitle { font: 700 14px sans-serif; fill: #333 }
    .divider { stroke: #ccc; stroke-width: 1 }
  </style>

  <rect class="card" x="40" y="40" width="720" height="920" rx="8" />
  <rect class="header" x="40" y="40" width="720" height="60" rx="8" />
  <text class="headerText" x="400" y="75">Mess</text>

  <line class="divider" x1="40" y1="120" x2="760" y2="120" stroke-width="2" />
  <line class="divider" x1="400" y1="120" x2="400" y2="960" stroke-width="2" />

  <text class="sectionTitle" x="60" y="150">Responsibilities:</text>
  <text class="content" x="60" y="180">â€¢ Store mess name and info</text>
  <text class="content" x="60" y="205">â€¢ Track manager (User)</text>
  <text class="content" x="60" y="230">â€¢ Reference mess request</text>
  <text class="content" x="60" y="255">â€¢ Manage list of members</text>
  <text class="content" x="60" y="280">â€¢ Track meals logged by members</text>
  <text class="content" x="60" y="305">â€¢ Track expenses added</text>
  <text class="content" x="60" y="330">â€¢ Track fixed costs monthly</text>
  <text class="content" x="60" y="355">â€¢ Maintain transaction ledger</text>

  <text class="sectionTitle" x="420" y="150">Collaborators:</text>
  <text class="content" x="420" y="180">User</text>
  <text class="content" x="420" y="205">MessRequest</text>
  <text class="content" x="420" y="230">Meal</text>
  <text class="content" x="420" y="255">Expense</text>
  <text class="content" x="420" y="280">FixedCost</text>
  <text class="content" x="420" y="305">UserTransaction</text>

  <text class="sectionTitle" x="60" y="460">Attributes:</text>
  <text class="content" x="60" y="485">id, name, manager_user_id,</text>
  <text class="content" x="60" y="510">mess_request_id, created_at,</text>
  <text class="content" x="60" y="535">updated_at</text>

  <text class="content" x="60" y="620" style="font: 11px sans-serif; fill: #666;">Key Relations:</text>
  <text class="content" x="60" y="640" style="font: 11px sans-serif; fill: #666;">- belongsTo(User) [manager]</text>
  <text class="content" x="60" y="660" style="font: 11px sans-serif; fill: #666;">- belongsTo(MessRequest)</text>
  <text class="content" x="60" y="680" style="font: 11px sans-serif; fill: #666;">- hasMany(User, Meal, Expense,</text>
  <text class="content" x="60" y="700" style="font: 11px sans-serif; fill: #666;">  FixedCost, UserTransaction)</text>
</svg>
