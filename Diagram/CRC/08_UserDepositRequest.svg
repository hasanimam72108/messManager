  <text class="content" x="60" y="700" style="font: 11px sans-serif; fill: #666;">Key Relations:</text>
  <text class="content" x="60" y="720" style="font: 11px sans-serif; fill: #666;">- belongsTo(Mess, User, User)</text>
  <text class="content" x="60" y="740" style="font: 11px sans-serif; fill: #666;">- Manager approves â†’ creates</text>
  <text class="content" x="60" y="760" style="font: 11px sans-serif; fill: #666;">  deposit transaction</text>
</svg>
