  </style>

  <rect class="card" x="40" y="40" width="720" height="920" rx="8" />
  <rect class="header" x="40" y="40" width="720" height="60" rx="8" />
  <text class="headerText" x="400" y="75">UserDepositRequest</text>

  <line class="divider" x1="40" y1="120" x2="760" y2="120" stroke-width="2" />
  <line class="divider" x1="400" y1="120" x2="400" y2="960" stroke-width="2" />

  <text class="sectionTitle" x="60" y="150">Responsibilities:</text>
  <text class="content" x="60" y="180">â€¢ Store deposit amount</text>
  <text class="content" x="60" y="205">â€¢ Track request status</text>
  <text class="content" x="60" y="230">  (pending/approved/rejected)</text>
  <text class="content" x="60" y="255">â€¢ Track requested date</text>
  <text class="content" x="60" y="280">â€¢ Track approval date</text>
