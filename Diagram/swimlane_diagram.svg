<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="1020" viewBox="0 0 1500 1020">
  <style>
    text          { font-family: Arial, sans-serif; }
    .title        { font-size: 16px; font-weight: bold; fill: #111 }
    .laneName     { font-size: 12.5px; font-weight: bold; fill: #111; text-anchor: middle }
    .box          { fill: #fff; stroke: #444; stroke-width: 1.4 }
    .dia          { fill: #fff; stroke: #444; stroke-width: 1.4 }
    .dot          { fill: #222 }
    .txt          { font-size: 11px; fill: #111; text-anchor: middle }
    .txtsm        { font-size: 9.5px; fill: #555; text-anchor: middle }
    .lbl          { font-size: 9.5px; fill: #555 }
    .conn         { stroke: #333; stroke-width: 1.4; fill: none }
    .dash         { stroke: #888; stroke-width: 1.2; fill: none; stroke-dasharray: 5 4 }
    .laneA        { fill: #fafafa; stroke: #ccc; stroke-width: 1 }
    .laneB        { fill: #f5f5f5; stroke: #ccc; stroke-width: 1 }
    .hdiv         { stroke: #bbb; stroke-width: 1 }
    .vdiv         { stroke: #bbb; stroke-width: 1 }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#333"/>
    </marker>
    <marker id="d" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#888"/>
    </marker>
  </defs>

  <!-- Title -->
  <text class="title" x="18" y="28">Swimlane Diagram — MessManager System</text>

  <!--
    Lane layout (y=38 to y=1010, total height 972)
    Member    : x=18,  w=210, cx=123
    Manager   : x=228, w=210, cx=333
    Admin     : x=438, w=210, cx=543
    Web UI    : x=648, w=210, cx=753
    Laravel API: x=858, w=225, cx=970
    Database  : x=1083,w=210, cx=1188
    Right edge: 1293 + right margin = 1310
  -->

  <!-- Lane backgrounds -->
  <rect class="laneA" x="18"   y="38" width="210" height="972"/>
  <rect class="laneB" x="228"  y="38" width="210" height="972"/>
  <rect class="laneA" x="438"  y="38" width="210" height="972"/>
  <rect class="laneB" x="648"  y="38" width="210" height="972"/>
  <rect class="laneA" x="858"  y="38" width="225" height="972"/>
  <rect class="laneB" x="1083" y="38" width="210" height="972"/>

  <!-- Vertical dividers -->
  <line class="vdiv" x1="228"  y1="38" x2="228"  y2="1010"/>
  <line class="vdiv" x1="438"  y1="38" x2="438"  y2="1010"/>
  <line class="vdiv" x1="648"  y1="38" x2="648"  y2="1010"/>
  <line class="vdiv" x1="858"  y1="38" x2="858"  y2="1010"/>
  <line class="vdiv" x1="1083" y1="38" x2="1083" y2="1010"/>

  <!-- Lane names -->
  <text class="laneName" x="123"  y="56">Member</text>
  <text class="laneName" x="333"  y="56">Manager</text>
  <text class="laneName" x="543"  y="56">Admin</text>
  <text class="laneName" x="753"  y="56">Web UI</text>
  <text class="laneName" x="970"  y="56">Laravel API</text>
  <text class="laneName" x="1188" y="56">Database</text>

  <!-- Horizontal separator under lane names -->
  <line class="hdiv" x1="18" y1="62" x2="1293" y2="62"/>

  <!-- ═══════════════════════════════════
       START NODES
       ═══════════════════════════════════ -->
  <circle class="dot" cx="123" cy="84" r="10"/>
  <circle class="dot" cx="333" cy="84" r="10"/>
  <circle class="dot" cx="543" cy="84" r="10"/>

  <!-- ═══════════════════════════════════
       LOGIN & AUTHENTICATION
       ═══════════════════════════════════ -->

  <!-- Login box — Web UI lane -->
  <rect class="box" x="663" y="104" width="180" height="36" rx="3"/>
  <text class="txt" x="753" y="127">Login</text>

  <!-- Start nodes → Login (Web UI) -->
  <path class="conn" d="M123 94 L123 122 L661 122" marker-end="url(#a)"/>
  <path class="conn" d="M333 94 L333 115 L753 115 L753 102" marker-end="url(#a)"/>
  <path class="conn" d="M543 94 L543 110 L753 110" />

  <!-- Web UI → Laravel API: POST /login -->
  <line class="conn" x1="843" y1="122" x2="856" y2="122" marker-end="url(#a)"/>
  <rect class="box" x="870" y="104" width="195" height="36" rx="3"/>
  <text class="txt" x="967" y="120">Authentication</text>
  <text class="txtsm" x="967" y="134">POST /api/login</text>

  <!-- Laravel API → Database -->
  <line class="conn" x1="1065" y1="122" x2="1081" y2="122" marker-end="url(#a)"/>
  <rect class="box" x="1095" y="104" width="185" height="36" rx="3"/>
  <text class="txt" x="1187" y="127">Validate User</text>

  <!-- Valid? diamond — in API lane -->
  <polygon class="dia" points="967,158 1022,185 967,212 912,185"/>
  <text class="txt" x="967" y="189">Valid?</text>
  <line class="conn" x1="967" y1="140" x2="967" y2="156" marker-end="url(#a)"/>

  <!-- Invalid → back to Web UI Login (dashed) -->
  <path class="dash" d="M912 185 L753 185 L753 140" marker-end="url(#d)"/>
  <text class="lbl" x="820" y="180">Invalid</text>

  <!-- Valid → Role? -->
  <path class="conn" d="M967 212 L967 232 L753 232 L753 218" marker-end="url(#a)"/>
  <text class="lbl" x="976" y="228">Valid</text>

  <!-- Role? diamond — in Web UI lane -->
  <polygon class="dia" points="753,218 808,245 753,272 698,245"/>
  <text class="txt" x="753" y="249">Role?</text>

  <!-- Role → Member -->
  <path class="conn" d="M698 245 L123 245 L123 295" marker-end="url(#a)"/>
  <text class="lbl" x="380" y="240">Member</text>

  <!-- Role → Manager -->
  <path class="conn" d="M753 272 L753 285 L333 285 L333 295" marker-end="url(#a)"/>
  <text class="lbl" x="540" y="283">Manager</text>

  <!-- Role → Admin -->
  <path class="conn" d="M808 245 L830 245 L830 290 L543 290 L543 295" marker-end="url(#a)"/>
  <text class="lbl" x="838" y="242">Admin</text>

  <!-- ═══════════════════════════════════════════════
       ROW 1 (y=295–331) — Dashboards
       ═══════════════════════════════════════════════ -->
  <!-- Member: View Dashboard -->
  <rect class="box" x="33" y="295" width="180" height="36" rx="3"/>
  <text class="txt" x="123" y="318">View Dashboard</text>

  <!-- Manager: Manager Dashboard -->
  <rect class="box" x="243" y="295" width="180" height="36" rx="3"/>
  <text class="txt" x="333" y="318">Manager Dashboard</text>

  <!-- Admin: Admin Panel -->
  <rect class="box" x="453" y="295" width="180" height="36" rx="3"/>
  <text class="txt" x="543" y="318">Admin Panel</text>

  <!-- Web UI: Fetch Dashboard -->
  <rect class="box" x="663" y="295" width="180" height="36" rx="3"/>
  <text class="txt" x="753" y="311">GET Dashboard</text>
  <text class="txtsm" x="753" y="325">/api/{role}/dashboard</text>

  <!-- API: Auth & Return -->
  <rect class="box" x="870" y="295" width="195" height="36" rx="3"/>
  <text class="txt" x="967" y="318">Auth &amp; Return Data</text>

  <!-- DB: Query Stats -->
  <rect class="box" x="1095" y="295" width="185" height="36" rx="3"/>
  <text class="txt" x="1187" y="318">Query Stats</text>

  <!-- Actors → Web UI dashboard -->
  <line class="conn" x1="213" y1="313" x2="661" y2="313" marker-end="url(#a)"/>
  <!-- Web UI → API -->
  <line class="conn" x1="843" y1="313" x2="868" y2="313" marker-end="url(#a)"/>
  <!-- API → DB -->
  <line class="conn" x1="1065" y1="313" x2="1093" y2="313" marker-end="url(#a)"/>

  <!-- ═══════════════════════════════════════════════
       ROW 2 (y=355–391) — Members / Bills / Approval
       ═══════════════════════════════════════════════ -->
  <line class="conn" x1="123" y1="331" x2="123" y2="355" marker-end="url(#a)"/>
  <line class="conn" x1="333" y1="331" x2="333" y2="355" marker-end="url(#a)"/>
  <line class="conn" x1="543" y1="331" x2="543" y2="355" marker-end="url(#a)"/>

  <!-- Member: View Bill Summary -->
  <rect class="box" x="33" y="355" width="180" height="36" rx="3"/>
  <text class="txt" x="123" y="378">View Bill Summary</text>

  <!-- Manager: Manage Members -->
  <rect class="box" x="243" y="355" width="180" height="36" rx="3"/>
  <text class="txt" x="333" y="378">Manage Members</text>

  <!-- Admin: Approve / Reject -->
  <rect class="box" x="453" y="355" width="180" height="36" rx="3"/>
  <text class="txt" x="543" y="378">Approve / Reject</text>

  <!-- Web UI -->
  <rect class="box" x="663" y="355" width="180" height="36" rx="3"/>
  <text class="txt" x="753" y="371">GET Bill / Members</text>
  <text class="txtsm" x="753" y="385">/api/{role}/members</text>

  <!-- API -->
  <rect class="box" x="870" y="355" width="195" height="36" rx="3"/>
  <text class="txt" x="967" y="378">Process &amp; Return</text>

  <!-- DB -->
  <rect class="box" x="1095" y="355" width="185" height="36" rx="3"/>
  <text class="txt" x="1187" y="378">Query Users / Bills</text>

  <!-- Connectors row 2 -->
  <line class="conn" x1="213" y1="373" x2="661" y2="373" marker-end="url(#a)"/>
  <line class="conn" x1="843" y1="373" x2="868" y2="373" marker-end="url(#a)"/>
  <line class="conn" x1="1065" y1="373" x2="1093" y2="373" marker-end="url(#a)"/>

  <!-- ═══════════════════════════════════════════════
       ROW 3 (y=415–451) — Meals / Deposit Approval / View All Mess
       ═══════════════════════════════════════════════ -->
  <line class="conn" x1="123" y1="391" x2="123" y2="415" marker-end="url(#a)"/>
  <line class="conn" x1="333" y1="391" x2="333" y2="415" marker-end="url(#a)"/>
  <line class="conn" x1="543" y1="391" x2="543" y2="415" marker-end="url(#a)"/>

  <!-- Member: Meals Entry -->
  <rect class="box" x="33" y="415" width="180" height="36" rx="3"/>
  <text class="txt" x="123" y="438">Meals Entry</text>

  <!-- Manager: Deposit Approval -->
  <rect class="box" x="243" y="415" width="180" height="36" rx="3"/>
  <text class="txt" x="333" y="438">Deposit Approval</text>

  <!-- Admin: View All Mess -->
  <rect class="box" x="453" y="415" width="180" height="36" rx="3"/>
  <text class="txt" x="543" y="438">View All Mess</text>

  <!-- Web UI -->
  <rect class="box" x="663" y="415" width="180" height="36" rx="3"/>
  <text class="txt" x="753" y="431">POST /user/meals</text>
  <text class="txtsm" x="753" y="445">Meal entry form</text>

  <!-- API -->
  <rect class="box" x="870" y="415" width="195" height="36" rx="3"/>
  <text class="txt" x="967" y="438">Validate &amp; Save Meal</text>

  <!-- DB -->
  <rect class="box" x="1095" y="415" width="185" height="36" rx="3"/>
  <text class="txt" x="1187" y="438">Insert Meal</text>

  <!-- Connectors row 3 -->
  <line class="conn" x1="213" y1="433" x2="661" y2="433" marker-end="url(#a)"/>
  <line class="conn" x1="843" y1="433" x2="868" y2="433" marker-end="url(#a)"/>
  <line class="conn" x1="1065" y1="433" x2="1093" y2="433" marker-end="url(#a)"/>

  <!-- ═══════════════════════════════════════════════
       ROW 4 (y=475–511) — Request Deposit / Manage Expenses
       ═══════════════════════════════════════════════ -->
  <line class="conn" x1="123" y1="451" x2="123" y2="475" marker-end="url(#a)"/>
  <line class="conn" x1="333" y1="451" x2="333" y2="475" marker-end="url(#a)"/>

  <!-- Member: Request Deposit -->
  <rect class="box" x="33" y="475" width="180" height="36" rx="3"/>
  <text class="txt" x="123" y="498">Request Deposit</text>

  <!-- Manager: Manage Expenses -->
  <rect class="box" x="243" y="475" width="180" height="36" rx="3"/>
  <text class="txt" x="333" y="498">Manage Expenses</text>

  <!-- Cross-lane: Request Deposit → Deposit Approval (row above) -->
  <path class="conn" d="M213 493 L243 493 L243 451 L241 433" marker-end="url(#a)"/>

  <!-- Web UI -->
  <rect class="box" x="663" y="475" width="180" height="36" rx="3"/>
  <text class="txt" x="753" y="491">POST /user/transactions</text>
  <text class="txtsm" x="753" y="505">Submit deposit request</text>

  <!-- API -->
  <rect class="box" x="870" y="475" width="195" height="36" rx="3"/>
  <text class="txt" x="967" y="498">Create DepositRequest</text>

  <!-- DB -->
  <rect class="box" x="1095" y="475" width="185" height="36" rx="3"/>
  <text class="txt" x="1187" y="491">Insert DepositRequest</text>
  <text class="txtsm" x="1187" y="505">status = pending</text>

  <!-- Connectors row 4 -->
  <line class="conn" x1="213" y1="493" x2="661" y2="493" marker-end="url(#a)"/>
  <line class="conn" x1="843" y1="493" x2="868" y2="493" marker-end="url(#a)"/>
  <line class="conn" x1="1065" y1="493" x2="1093" y2="493" marker-end="url(#a)"/>

  <!-- ═══════════════════════════════════════════════
       ROW 5 (y=535–571) — View Transactions / Set Fixed Costs
       ═══════════════════════════════════════════════ -->
  <line class="conn" x1="123" y1="511" x2="123" y2="535" marker-end="url(#a)"/>
  <line class="conn" x1="333" y1="511" x2="333" y2="535" marker-end="url(#a)"/>

  <!-- Member: View Transactions -->
  <rect class="box" x="33" y="535" width="180" height="36" rx="3"/>
  <text class="txt" x="123" y="558">View Transactions</text>

  <!-- Manager: Set Fixed Costs -->
  <rect class="box" x="243" y="535" width="180" height="36" rx="3"/>
  <text class="txt" x="333" y="558">Set Fixed Costs</text>

  <!-- Web UI -->
  <rect class="box" x="663" y="535" width="180" height="36" rx="3"/>
  <text class="txt" x="753" y="551">GET /user/transactions</text>
  <text class="txtsm" x="753" y="565">Transaction history</text>

  <!-- API -->
  <rect class="box" x="870" y="535" width="195" height="36" rx="3"/>
  <text class="txt" x="967" y="558">Fetch Transactions</text>

  <!-- DB -->
  <rect class="box" x="1095" y="535" width="185" height="36" rx="3"/>
  <text class="txt" x="1187" y="558">Query UserTransactions</text>

  <!-- Connectors row 5 -->
  <line class="conn" x1="213" y1="553" x2="661" y2="553" marker-end="url(#a)"/>
  <line class="conn" x1="843" y1="553" x2="868" y2="553" marker-end="url(#a)"/>
  <line class="conn" x1="1065" y1="553" x2="1093" y2="553" marker-end="url(#a)"/>

  <!-- ═══════════════════════════════════════════════
       ROW 6 (y=595–631) — Monthly Reports (Manager only)
       ═══════════════════════════════════════════════ -->
  <line class="conn" x1="333" y1="571" x2="333" y2="595" marker-end="url(#a)"/>

  <!-- Manager: Monthly Reports -->
  <rect class="box" x="243" y="595" width="180" height="36" rx="3"/>
  <text class="txt" x="333" y="618">Monthly Reports</text>

  <!-- Web UI -->
  <rect class="box" x="663" y="595" width="180" height="36" rx="3"/>
  <text class="txt" x="753" y="611">GET /manager/expenses</text>
  <text class="txtsm" x="753" y="625">Monthly summary</text>

  <!-- API -->
  <rect class="box" x="870" y="595" width="195" height="36" rx="3"/>
  <text class="txt" x="967" y="618">Aggregate Monthly Data</text>

  <!-- DB -->
  <rect class="box" x="1095" y="595" width="185" height="36" rx="3"/>
  <text class="txt" x="1187" y="618">Query Month Records</text>

  <!-- Manager → Web UI -->
  <line class="conn" x1="423" y1="613" x2="661" y2="613" marker-end="url(#a)"/>
  <line class="conn" x1="843" y1="613" x2="868" y2="613" marker-end="url(#a)"/>
  <line class="conn" x1="1065" y1="613" x2="1093" y2="613" marker-end="url(#a)"/>

  <!-- ═══════════════════════════════════════════════
       LOGOUT (y=680–716) — all converge
       ═══════════════════════════════════════════════ -->

  <!-- Logout box — Manager lane -->
  <rect class="box" x="243" y="700" width="180" height="36" rx="3"/>
  <text class="txt" x="333" y="723">Logout</text>

  <!-- Member (View Transactions end) → Logout -->
  <path class="conn" d="M123 571 L123 718 L241 718" marker-end="url(#a)"/>

  <!-- Manager (Monthly Reports) → Logout -->
  <line class="conn" x1="333" y1="631" x2="333" y2="698" marker-end="url(#a)"/>

  <!-- Admin (View All Mess) → Logout -->
  <path class="conn" d="M543 451 L543 718 L425 718" marker-end="url(#a)"/>

  <!-- Web UI: POST /logout -->
  <rect class="box" x="663" y="700" width="180" height="36" rx="3"/>
  <text class="txt" x="753" y="723">POST /api/logout</text>

  <!-- Logout → Web UI -->
  <line class="conn" x1="423" y1="718" x2="661" y2="718" marker-end="url(#a)"/>

  <!-- API: Revoke Token -->
  <rect class="box" x="870" y="700" width="195" height="36" rx="3"/>
  <text class="txt" x="967" y="723">Revoke Token</text>
  <line class="conn" x1="843" y1="718" x2="868" y2="718" marker-end="url(#a)"/>

  <!-- DB: Delete Token -->
  <rect class="box" x="1095" y="700" width="185" height="36" rx="3"/>
  <text class="txt" x="1187" y="723">Delete Token</text>
  <line class="conn" x1="1065" y1="718" x2="1093" y2="718" marker-end="url(#a)"/>

  <!-- ═══════════════════════════════════════════════
       END NODES
       ═══════════════════════════════════════════════ -->

  <!-- Arrows from Logout back to actor lanes for end nodes -->
  <path class="conn" d="M243 718 L123 718 L123 758" marker-end="url(#a)"/>
  <line class="conn" x1="333" y1="736" x2="333" y2="758" marker-end="url(#a)"/>
  <path class="conn" d="M425 718 L543 718 L543 758" marker-end="url(#a)"/>

  <!-- End nodes (filled circle + outer ring = UML final state) -->
  <circle class="dot" cx="123" cy="768" r="10"/>
  <circle cx="123" cy="768" r="16" fill="none" stroke="#222" stroke-width="2"/>

  <circle class="dot" cx="333" cy="768" r="10"/>
  <circle cx="333" cy="768" r="16" fill="none" stroke="#222" stroke-width="2"/>

  <circle class="dot" cx="543" cy="768" r="10"/>
  <circle cx="543" cy="768" r="16" fill="none" stroke="#222" stroke-width="2"/>

</svg>