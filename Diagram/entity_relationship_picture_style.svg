  <text class="note" x="30" y="1320">Payments in this diagram represent the project’s deposit flow: user_deposit_requests plus user_transactions.</text>
  <text class="note" x="30" y="1344">Role-based users are modeled in the users table; the labels SuperAdmin / Manager / Members reflect application roles.</text>
  <text class="note" x="30" y="1368">If you want, I can also draw a strict crow’s-foot ERD version from the same schema.</text>
