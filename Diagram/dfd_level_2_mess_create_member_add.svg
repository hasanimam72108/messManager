<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700">
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="12" refY="6" orient="auto">
      <path d="M0 0 L12 6 L0 12 z" fill="#000" />
    </marker>
    <style>
      .entity { fill:#fff;stroke:#000;stroke-width:2 }
      .process { fill:#f8f9fa;stroke:#111;stroke-width:3 }
      .datastore { fill:#fff;stroke:#000;stroke-width:2 }
      .label { font:14px Arial; }
      .title { font:16px Arial; font-weight:bold; }
      .flow { fill:none; stroke:#000; stroke-width:2 }
    </style>
  </defs>

  <!-- External Entities -->
  <rect class="entity" x="30" y="120" width="160" height="60" rx="6"/>
  <text x="110" y="155" text-anchor="middle" class="label">Manager</text>

  <rect class="entity" x="30" y="20" width="160" height="60" rx="6"/>
  <text x="110" y="55" text-anchor="middle" class="label">SuperAdmin</text>

  <rect class="entity" x="30" y="260" width="160" height="60" rx="6"/>
  <text x="110" y="295" text-anchor="middle" class="label">Member</text>

  <!-- Processes -->
  <rect class="process" x="260" y="40" width="320" height="80" rx="24" />
  <text x="420" y="70" text-anchor="middle" class="title">1.1 Mess Create</text>
  <text x="420" y="92" text-anchor="middle" class="label">(Collect request & details)</text>

  <rect class="process" x="260" y="160" width="320" height="80" rx="24" />
  <text x="420" y="190" text-anchor="middle" class="title">1.2 Approve & Create Mess</text>
  <text x="420" y="212" text-anchor="middle" class="label">(Approval, create record)</text>

  <rect class="process" x="260" y="320" width="320" height="80" rx="24" />
  <text x="420" y="350" text-anchor="middle" class="title">2.1 Member Add</text>
  <text x="420" y="372" text-anchor="middle" class="label">(Collect member emails)</text>

  <rect class="process" x="260" y="440" width="320" height="80" rx="24" />
  <text x="420" y="470" text-anchor="middle" class="title">2.2 Invite / Create Accounts</text>
  <text x="420" y="492" text-anchor="middle" class="label">(Send invite / create user)</text>

  <!-- Data stores -->
  <g transform="translate(640,24)">
    <rect class="datastore" x="0" y="0" width="220" height="60" rx="10"/>
    <text x="110" y="35" text-anchor="middle" class="label">D1: Mess DB</text>
  </g>

  <g transform="translate(640,200)">
    <rect class="datastore" x="0" y="0" width="220" height="60" rx="10"/>
    <text x="110" y="35" text-anchor="middle" class="label">D2: Users DB</text>
  </g>

  <g transform="translate(640,360)">
    <rect class="datastore" x="0" y="0" width="220" height="60" rx="10"/>
    <text x="110" y="35" text-anchor="middle" class="label">D3: Invitations Queue</text>
  </g>

  <!-- Flows: Manager -> 1.1 -->
  <path class="flow" d="M190 150 C220 150 240 150 260 150" marker-end="url(#arrow)" />
  <text x="225" y="140" class="label" text-anchor="middle">Mess Request</text>

  <!-- 1.1 -> 1.2 (request data) -->
  <path class="flow" d="M580 80 C600 60 620 60 640 80" marker-end="url(#arrow)"/>
  <path class="flow" d="M420 120 C420 140 420 140 420 160" marker-end="url(#arrow)"/>
  <text x="460" y="140" class="label">Mess Details</text>

  <!-- SuperAdmin -> 1.2 approval -->
  <path class="flow" d="M110 60 C160 60 210 120 260 200" marker-end="url(#arrow)"/>
  <text x="170" y="110" class="label" text-anchor="middle">Approve / Reject</text>

  <!-- 1.2 -> D1 (create mess) -->
  <path class="flow" d="M580 200 C600 190 620 190 640 200" marker-end="url(#arrow)"/>
  <text x="610" y="185" class="label" text-anchor="middle">Create Mess Record</text>

  <!-- Manager -> 2.1 Member Add -->
  <path class="flow" d="M190 290 C210 320 235 345 260 360" marker-end="url(#arrow)"/>
  <text x="225" y="325" class="label" text-anchor="middle">Member Emails</text>

  <!-- 2.1 -> 2.2 (pass emails) -->
  <path class="flow" d="M580 360 C600 360 620 360 640 360" marker-end="url(#arrow)"/>
  <text x="610" y="350" class="label" text-anchor="middle">Member List</text>

  <!-- 2.2 -> D2 (create users) -->
  <path class="flow" d="M580 480 C600 420 620 340 640 220" marker-end="url(#arrow)"/>
  <text x="700" y="320" class="label">Create User Accounts</text>

  <!-- 2.2 -> D3 (invite queue) -->
  <path class="flow" d="M580 480 C600 460 620 440 640 380" marker-end="url(#arrow)"/>
  <text x="610" y="430" class="label" text-anchor="middle">Send Invites</text>

  <!-- D3 -> Member (email) routed to avoid overlaps -->
  <path class="flow" d="M640 420 C720 420 640 330 300 320 C230 320 190 300 190 300" marker-end="url(#arrow)"/>
  <text x="520" y="290" class="label">Invitation Email</text>

  <!-- small legend/title -->
  <text x="600" y="20" text-anchor="middle" class="title">DFD Level 2 — Mess Create & Member Add</text>
</svg>